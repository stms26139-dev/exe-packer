name: Build Evader Packer

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Remove missing ManualUnpack from solution
      shell: pwsh
      run: |
        $sln = Get-Content "Evader.sln" -Raw
        $sln = $sln -replace '(?s)Project\("\{8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942\}"\) = "ManualUnpack".*?EndProject\r?\n', ''
        $sln = $sln -replace '(?m)^.*\{00E651F5-67DD-483D-BC2A-54876B874CDF\}.*\r?\n', ''
        Set-Content "Evader.sln" -Value $sln -NoNewline
        Write-Host "ManualUnpack removed from solution"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (Release | x86)
      run: |
        msbuild Evader.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /m /v:minimal

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        
        $files = @(
          "UnpackStubBuild\bin\Win32\Release\UnpackStub.exe",
          "PackerBuild\bin\Win32\Release\Packer.exe"
        )
        
        foreach ($f in $files) {
          if (Test-Path $f) {
            Write-Host "Copying $f"
            Copy-Item $f -Destination "artifacts\" -Force
          } else {
            Write-Host "NOT FOUND: $f"
          }
        }
        
        Write-Host "`n=== Artifacts content ==="
        Get-ChildItem artifacts | Format-Table Name, Length

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Evader-Binaries
        path: artifacts/
        retention-days: 7

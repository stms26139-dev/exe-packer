name: Build Evader Packer

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (Release | Win32)
      run: |
        msbuild Evader.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal

    - name: Prepare Artifacts
      run: |
        mkdir artifacts
        if (Test-Path "Packer\Release\Packer.exe") { copy "Packer\Release\Packer.exe" artifacts\ }
        if (Test-Path "UnpackStub\Release\UnpackStub.exe") { 
          copy "UnpackStub\Release\UnpackStub.exe" artifacts\
          copy "UnpackStub\Release\UnpackStub.exe" artifacts\UnpackStub.exe
        }
        # لو الـ output في مجلد تاني
        Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.FullName -match "Release" } | ForEach-Object {
          Copy-Item $_.FullName -Destination artifacts\ -Force
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Evader-Binaries
        path: artifacts/
        retention-days: 7

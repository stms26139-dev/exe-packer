name: Build Evader Packer

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (Release | x86)
      run: |
        msbuild Evader.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /m /v:minimal

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        
        # نبحث عن أي exe اتعمل
        Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { 
          $_.FullName -match "Release" -or $_.FullName -match "x86" 
        } | ForEach-Object {
          Write-Host "Found: $($_.FullName)"
          Copy-Item $_.FullName -Destination "artifacts\" -Force
        }
        
        # نتأكد إن UnpackStub موجود جنب Packer
        if (Test-Path "artifacts\UnpackStub.exe") {
          Copy-Item "artifacts\UnpackStub.exe" -Destination "artifacts\UnpackStub.exe" -Force
        }

    - name: List artifacts
      run: dir artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Evader-Binaries
        path: artifacts/
        retention-days: 7
